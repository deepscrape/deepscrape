name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
      angular: ${{ steps.changes.outputs.angular }}
      hosting: ${{ steps.changes.outputs.hosting }}
      bff: ${{ steps.changes.outputs.bff }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            functions:
              - 'functions/**'
            angular:
              - 'src/**'
            hosting:
              - 'firebase.json'
              - 'angular.json'
              - 'package.json'
              - 'bun.lockb'
              - 'dist/**'
            bff:
              - 'bff/**'
              - 'Dockerfile'

  build_and_deploy:
    needs: detect_changes
    runs-on: ubuntu-latest
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IP2LOCATION_GCS_PATH: ${{ vars.IP2LOCATION_GCS_PATH }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Configure Firebase CLI authentication
        run: |
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          cat <<'EOF' > "$credentials_path"
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=${FIREBASE_PROJECT_ID}" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=${FIREBASE_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Install npm 11.11.x
        run: npm install -g npm@11.11.x

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile
          cd functions && bun install --frozen-lockfile && cd ..
          
      - name: Validate Required Environment Variables
        run: |
          missing=0
          required_vars=(
            PRODUCTION API_KEY AUTH_DOMAIN DATABASE_URL PROJECT_ID STORAGE_BUCKET
            MESSAGING_SENDER_ID APP_ID RECAPTCHA_KEY ANTHROPIC_API_KEY CRAWL4AI_API_KEY
            OPENAI_API_KEY GROQ_API_KEY GOOGLE_API_KEY JINAAI_API_KEY UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_PORT UPSTASH_REDIS_REST_USER UPSTASH_REDIS_REST_PASSWORD
            UPSTASH_REDIS_REST_TOKEN API_CRAWL4AI_URL API_ARACHNEFLY_URL 
            STRIPE_PUBLIC_KEY GCP_PROJECT_ID MEASUREMENT_ID COOKIE_SECRET CSRF_COOKIE_SECRET
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing required env: $var_name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          PRODUCTION: true
          EMULATORS: "false"
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MEASUREMENT_ID: ${{ vars.MEASUREMENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_PORT: ${{ vars.UPSTASH_REDIS_REST_PORT }}
          UPSTASH_REDIS_REST_USER: ${{ secrets.UPSTASH_REDIS_REST_USER }}
          UPSTASH_REDIS_REST_PASSWORD: ${{ secrets.UPSTASH_REDIS_REST_PASSWORD }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.CSRF_COOKIE_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.APP_ID }}
          RECAPTCHA_KEY: ${{ secrets.RECAPTCHA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRAWL4AI_API_KEY: ${{ secrets.CRAWL4AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JINAAI_API_KEY: ${{ secrets.JINAAI_API_KEY }}
          API_CRAWL4AI_URL: ${{ vars.API_CRAWL4AI_URL }}
          API_ARACHNEFLY_URL: ${{ vars.API_ARACHNEFLY_URL }}
      # Build Angular App in production mode
      - name: Build Angular App
        # The BFF image embeds dist/deepscrape/browser (Dockerfile COPY), so a
        # bff-only change still needs the Angular build — and so does a
        # functions-only change, because the image step below runs on
        # `functions == 'true'` too and would hit a missing `dist/`.
        if: needs.detect_changes.outputs.angular == 'true' || needs.detect_changes.outputs.hosting == 'true' || needs.detect_changes.outputs.bff == 'true' || needs.detect_changes.outputs.functions == 'true'
        run: bun run build
        env:
          PRODUCTION: true
          EMULATORS: "false"
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MEASUREMENT_ID: ${{ vars.MEASUREMENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_PORT: ${{ vars.UPSTASH_REDIS_REST_PORT }}
          UPSTASH_REDIS_REST_USER: ${{ secrets.UPSTASH_REDIS_REST_USER }}
          UPSTASH_REDIS_REST_PASSWORD: ${{ secrets.UPSTASH_REDIS_REST_PASSWORD }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.CSRF_COOKIE_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.APP_ID }}
          RECAPTCHA_KEY: ${{ secrets.RECAPTCHA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRAWL4AI_API_KEY: ${{ secrets.CRAWL4AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JINAAI_API_KEY: ${{ secrets.JINAAI_API_KEY }}
          API_CRAWL4AI_URL: ${{ vars.API_CRAWL4AI_URL }}
          API_ARACHNEFLY_URL: ${{ vars.API_ARACHNEFLY_URL }}

      # Build Firebase Functions in production mode
      - name: Build Firebase Functions
        if: needs.detect_changes.outputs.functions == 'true'
        working-directory: ./functions
        run: bun run build

      # Cloud Run FIRST: firebase.json rewrites `**` -> run/deepscrape-bff, so
      # Hosting must never be pointed at an image this run did not rebuild.
      - name: Build & deploy BFF (Cloud Run)
        if: needs.detect_changes.outputs.bff == 'true' || needs.detect_changes.outputs.functions == 'true' || needs.detect_changes.outputs.angular == 'true' || needs.detect_changes.outputs.hosting == 'true'
        run: |
          set -euo pipefail
          image="us-central1-docker.pkg.dev/libnet-d76db/deepscrape/deepscrape-bff:latest"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project "$FIREBASE_PROJECT_ID" --quiet
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -f Dockerfile -t "$image" .
          docker push "$image"
          gcloud run deploy deepscrape-bff \
            --image "$image" \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi --cpu 1 \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 40 \
            --cpu-boost \
            --set-env-vars PRODUCTION=true \
            --set-secrets FUNCTIONS_ENV_JSON=FUNCTIONS_ENV_JSON:latest,FIRE_SERVICE_ACCOUNT_KEY=FIRE_SERVICE_ACCOUNT_KEY:latest \
            --quiet

      # Deploy to Firebase Hosting
      # `firebase.json` declares THREE hosting configs (targets marketing/dashboard/console)
      # that all serve the same build. A channel deploy can only address ONE site, so
      # action-hosting-deploy fails here — it has no `target` input set. The CLI fans
      # `--only hosting` out across every target instead. Auth comes from
      # GOOGLE_APPLICATION_CREDENTIALS, exported above and already used by the functions
      # deploy step below.
      - name: Deploy to Firebase Hosting
        if: needs.detect_changes.outputs.angular == 'true' || needs.detect_changes.outputs.hosting == 'true'
        # The CLI, not action-hosting-deploy: `firebase.json` declares THREE
        # hosting configs (targets marketing/dashboard/console) and a channel
        # deploy can only address ONE site — the action has no `target` input, so
        # without it, it deploys nothing. `--only hosting` fans out across every
        # target. Auth comes from GOOGLE_APPLICATION_CREDENTIALS, exported above.
        run: npx firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          PRODUCTION: true
          EMULATORS: "false"
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MEASUREMENT_ID: ${{ vars.MEASUREMENT_ID }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_PORT: ${{ vars.UPSTASH_REDIS_REST_PORT }}
          UPSTASH_REDIS_REST_USER: ${{ secrets.UPSTASH_REDIS_REST_USER }}
          UPSTASH_REDIS_REST_PASSWORD: ${{ secrets.UPSTASH_REDIS_REST_PASSWORD }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.CSRF_COOKIE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JINAAI_API_KEY: ${{ secrets.JINAAI_API_KEY }}
          API_CRAWL4AI_URL: ${{ vars.API_CRAWL4AI_URL }}
          API_ARACHNEFLY_URL: ${{ vars.API_ARACHNEFLY_URL }}

      # Rules, indexes and Storage rules live in git but had no deploy path at
      # all — the only callers were manual `package.json` scripts. A merged rule
      # change was green in CI and never reached the database, and an undeployed
      # collection-group index answers FAILED_PRECONDITION, which the admin
      # sessions page renders as "no sessions" (an operator reading "idle" while
      # customers are billed). Runs on every merge because these files are the
      # source of truth and a merge is the only moment they can change.
      - name: Deploy Firestore rules, indexes and Storage rules
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Prepare functions .env for deploy analysis
        run: |
          cat > functions/.env <<EOF
          PRODUCTION=true
          API_CRAWL4AI_URL=${API_CRAWL4AI_URL}
          API_ARACHNEFLY_URL=${API_ARACHNEFLY_URL}
          UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
          UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
          UPSTASH_REDIS_REST_PORT=${UPSTASH_REDIS_REST_PORT}
          UPSTASH_REDIS_REST_USER=${UPSTASH_REDIS_REST_USER}
          UPSTASH_REDIS_REST_PASSWORD=${UPSTASH_REDIS_REST_PASSWORD}
          COOKIE_SECRET=${COOKIE_SECRET}
          CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
          GCP_PROJECT_ID=${GCP_PROJECT_ID}
          IP2LOCATION_GCS_PATH=${IP2LOCATION_GCS_PATH}
          EOF
        env:
          API_CRAWL4AI_URL: ${{ vars.API_CRAWL4AI_URL }}
          API_ARACHNEFLY_URL: ${{ vars.API_ARACHNEFLY_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_PORT: ${{ vars.UPSTASH_REDIS_REST_PORT }}
          UPSTASH_REDIS_REST_USER: ${{ secrets.UPSTASH_REDIS_REST_USER }}
          UPSTASH_REDIS_REST_PASSWORD: ${{ secrets.UPSTASH_REDIS_REST_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.CSRF_COOKIE_SECRET }}
          IP2LOCATION_GCS_PATH: ${{ vars.IP2LOCATION_GCS_PATH }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify Firebase Extensions access
        run: npx firebase-tools ext:list --project ${{ env.FIREBASE_PROJECT_ID }} --json

      - name: Deploy Firebase Functions
        working-directory: ./functions
        if: needs.detect_changes.outputs.functions == 'true'
        run: npx firebase-tools deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }} --force
        env:
          PRODUCTION: true
          API_CRAWL4AI_URL: ${{ vars.API_CRAWL4AI_URL }}
          API_ARACHNEFLY_URL: ${{ vars.API_ARACHNEFLY_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JINAAI_API_KEY: ${{ secrets.JINAAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_PRICE_STARTER_PAYG: ${{ vars.STRIPE_PRICE_STARTER_PAYG }}
          STRIPE_PRICE_STARTER_MONTHLY: ${{ vars.STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_STARTER_QUARTERLY: ${{ vars.STRIPE_PRICE_STARTER_QUARTERLY }}
          STRIPE_PRICE_STARTER_ANNUAL: ${{ vars.STRIPE_PRICE_STARTER_ANNUAL }}
          STRIPE_PRICE_PRO_PAYG: ${{ vars.STRIPE_PRICE_PRO_PAYG }}
          STRIPE_PRICE_PRO_MONTHLY: ${{ vars.STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_QUARTERLY: ${{ vars.STRIPE_PRICE_PRO_QUARTERLY }}
          STRIPE_PRICE_PRO_ANNUAL: ${{ vars.STRIPE_PRICE_PRO_ANNUAL }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY: ${{ vars.STRIPE_PRICE_ENTERPRISE_MONTHLY }}
          STRIPE_PRICE_ENTERPRISE_QUARTERLY: ${{ vars.STRIPE_PRICE_ENTERPRISE_QUARTERLY }}
          STRIPE_PRICE_ENTERPRISE_ANNUAL: ${{ vars.STRIPE_PRICE_ENTERPRISE_ANNUAL }}
          STRIPE_PRICE_CREDITS_100: ${{ vars.STRIPE_PRICE_CREDITS_100 }}
          STRIPE_PRICE_CREDITS_500: ${{ vars.STRIPE_PRICE_CREDITS_500 }}
          STRIPE_PRICE_CREDITS_2000: ${{ vars.STRIPE_PRICE_CREDITS_2000 }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MEASUREMENT_ID: ${{ vars.MEASUREMENT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_PORT: ${{ vars.UPSTASH_REDIS_REST_PORT }}
          UPSTASH_REDIS_REST_USER: ${{ secrets.UPSTASH_REDIS_REST_USER }}
          UPSTASH_REDIS_REST_PASSWORD: ${{ secrets.UPSTASH_REDIS_REST_PASSWORD }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_COOKIE_SECRET: ${{ secrets.CSRF_COOKIE_SECRET }}

