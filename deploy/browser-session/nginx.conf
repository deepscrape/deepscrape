# nginx for a browser-session machine.
#
# It exists for exactly two reasons, both forced by the contract arachnefly
# deploys (`BuildConfigMap`), and both are load-bearing:
#
#   1. The configured health check is `GET /` on the routed port. webrain
#      answers `/health` — deliberately the only extra route in its HTTP
#      server — and 401s everything else once a token is set. A failing check
#      makes flyd restart the machine, so `/` must answer 2xx here.
#
#   2. webrain must not be the process on the routed port, because the port
#      webrain binds is fixed by its own CLI and it refuses non-loopback binds
#      without a token. Proxying keeps one listener on the port Fly routes to
#      while webrain stays on loopback inside the container.
#
# What this does NOT do: verify the token. It can only check that an
# Authorization header is present, which stops a bare scan or a
# load-balancer hit from reaching a session. The real check is webrain's, one
# hop behind — it has the secret and this does not. Do not read the 401 below
# as authentication.

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # nginx creates these itself, and pointing them at /tmp avoids depending on
  # whichever temp tree the base package happens to ship — which is exactly what
  # changed when the base moved to Debian for glibc (see the Dockerfile). Paths
  # under /tmp survived that move; the distro default would not have.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # A browser session's calls are slow by nature: navigating a page, waiting on
  # a challenge, pulling a frame. nginx's 60s default would turn a legitimate
  # long call into a 504 and look like a platform fault.
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;

  server {
    # Must match the port `BuildConfigMap` sets as `internal_port`, which is
    # the `PORT` env var or 11235. The entrypoint refuses to start if the two
    # disagree.
    listen 11235;

    # The health check Fly actually calls.
    location = / {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # webrain's own probe, kept reachable so a human or an autoscaler can ask
    # the engine directly rather than inferring liveness from this proxy.
    location = /health {
      proxy_pass http://127.0.0.1:9223;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      # Presence only, not validity — see the header comment. The token itself
      # is checked by webrain, which is the only party holding the secret.
      if ($http_authorization = "") {
        return 401;
      }

      proxy_pass http://127.0.0.1:9223;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;

      # MCP responses stream; buffering would hold a whole result in nginx
      # before the caller saw any of it.
      proxy_buffering off;
    }
  }
}
