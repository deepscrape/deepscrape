<div class="relative flex h-full w-full flex-col gap-4 p-4">
  @if (activeLink !== 'keys') {
    <h1 class="text-xl font-semibold tracking-tight text-gray6 dark:text-white">
      {{ ( activeLink + ' ' + "Settings") | titlecase }}
    </h1>
  }
  <!--
    Tab menu.

    One accent, not six. The tab data carries a per-tab `color`, which this strip spent
    on a rainbow of pink/sky/green icons and a blue active border -- none of which is in
    the theme map, where `cyan` is the primary token and `rose` the accent. Colour is now
    spent on state alone, so the shell reads as one product with the pages it frames.
    The strip is also the surface now: the panel it used to sit in was a hard-coded
    `bg-gray-100 dark:bg-gray-900`, which is what made these pages look detached from the
    rest of the app.
  -->
  <div
    class="sticky top-20 z-20 flex snap-x flex-nowrap items-center gap-1 overflow-x-auto rounded-xl border border-gray-200/70 bg-gray-100/70 p-1 scrollbar-hidden backdrop-blur dark:border-gray-700/60 dark:bg-gray6/60"
    >
    @for (gTab of gTabs$ | async; track gTab) {
      <a
        (click)="activeLink = gTab.id"
        [routerLink]="routerLink(gTab.id)"
        routerLinkActive="active"
        appRipple
        rippleColor="dark"
        [attr.aria-current]="activeLink === gTab.id ? 'page' : null"
        [ngClass]="{
          'bg-white text-cyan-700 shadow-sm ring-1 ring-inset ring-cyan-500/25 dark:bg-cyan-950/40 dark:text-cyan-300 dark:ring-cyan-400/25':
            activeLink === gTab.id,
          'text-gray-600 hover:bg-white/70 hover:text-cyan-700 dark:text-gray-400 dark:hover:bg-gray6/60 dark:hover:text-cyan-300':
            activeLink !== gTab.id
        }"
        class="group flex h-11 w-full max-w-[9rem] flex-shrink-0 snap-normal items-center gap-2 rounded-lg px-3 text-sm font-medium transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500"
        >
        <!--
          The icon is decorative: it sits beside the tab's own text, so it carries no
          label of its own. `aria-hidden` was misspelled `faria-hidden`, which made it
          inert, so the placeholder `aria-label` "Example face SVG icon" was announced
          to screen readers on every tab. The per-tab colour chain also referenced
          `group-hover` on an element whose parent had no `group` class, so every one of
          those branches was dead.
        -->
        <lucide-angular
          aria-hidden="true"
          [img]="icons[gTab.icon]"
          [ngClass]="activeLink === gTab.id
            ? 'text-cyan-600 dark:text-cyan-300'
            : 'text-gray-400 group-hover:text-gray-500 dark:group-hover:text-gray-300'"
          class="h-4 w-4 flex-shrink-0 transition-colors duration-200 fill-none"></lucide-angular>
        <span class="truncate">{{ gTab.name }}</span>
      </a>
    }
  </div>

  <!-- Inner Section  -->

  <div class="min-w-0" [@routeChildAnimation]="getAnimationData(outlet)">
    <router-outlet #outlet="outlet"></router-outlet>
  </div>
</div>
