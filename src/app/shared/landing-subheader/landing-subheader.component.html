<header
  class="sticky top-0 z-50 w-full border-b transition-all duration-300 ease-out"
  [ngClass]="{
    'border-gray-200/60 dark:border-gray-800/60 bg-white/85 dark:bg-gray-900/90 backdrop-blur-xl shadow-lg shadow-cyan-500/5': isScrolled,
    'border-transparent bg-white/60 dark:bg-[#060606]/60 backdrop-blur-sm': !isScrolled
  }">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-3 px-4 py-2 sm:px-6 lg:px-8">
    <!-- Brand — same as the landpage header -->
    <a
      [routerLink]="['/']"
      aria-label="deepscrape home"
      class="group flex shrink-0 items-center gap-3">
      <img
        src=""
        alt="deepscrape logo"
        [srcset]="
          (isDarkMode$ | async)
            ? 'assets/logo-512x512_sky.png 2x'
            : 'assets/logo-512x512.png 2x'
        "
        class="h-9 w-9 group-hover:scale-105 transition-transform duration-300" />
      <span
        class="font-['Allerta_Stencil',monospace] text-lg sm:text-xl font-normal dark:font-bold leading-none select-none bg-gradient-to-r from-[#282b2c] to-[#4e50bd] dark:from-[#7e7e7e] dark:to-[#4A5C8F] bg-clip-text text-transparent drop-shadow-[1px_2px_0_rgba(0,0,0,0.25)] dark:drop-shadow-[4px_4px_0_rgba(0,0,0,0.25)]">
        DeepScrape
      </span>
    </a>

    <!-- Glass-pill nav (landpage style) -->
    <nav
      class="hidden items-center gap-1 rounded-full glass-pill px-2 py-1.5 md:flex"
      aria-label="Primary">
      @for (item of items; track item.link) {
        <a
          [routerLink]="[item.link]"
          routerLinkActive="subheader-link-active"
          [routerLinkActiveOptions]="{ exact: item.link === '/' }"
          class="rounded-full px-3.5 py-1.5 text-sm font-medium text-gray-600 hover:text-cyan-600 hover:bg-white/70 dark:text-gray-300 dark:hover:text-cyan-300 dark:hover:bg-white/5 transition-colors duration-200">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Theme + language controls (landpage order) -->
    <div class="flex items-center justify-end gap-2">
      <app-lang-picker></app-lang-picker>
      <app-theme-toggle [color]="{ dark: '#373737f0', light: '#fff' }"></app-theme-toggle>
    </div>
  </div>

  <!-- Mobile nav (horizontal scroll strip) -->
  <nav
    class="flex items-center gap-1 overflow-x-auto px-4 pb-2.5 md:hidden"
    aria-label="Mobile">
    @for (item of items; track item.link) {
      <a
        [routerLink]="[item.link]"
        routerLinkActive="subheader-link-active"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
        class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium text-gray-600 hover:text-cyan-600 dark:text-gray-300 dark:hover:text-cyan-300 transition-colors duration-200">
        {{ item.label }}
      </a>
    }
  </nav>
</header>
